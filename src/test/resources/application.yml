spring:
  datasource:
    url: jdbc:h2:mem:studywithme;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth:
    token:
      issuer: studywithme-test
      secret: studywithme-test-secret-key-must-be-at-least-32-bytes
      access-token-ttl: 30m
      refresh-token-ttl: 14d
