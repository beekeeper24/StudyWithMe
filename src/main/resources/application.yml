spring:
  application:
    name: studywithme
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/studywithme}
    username: ${SPRING_DATASOURCE_USERNAME:studywithme}
    password: ${SPRING_DATASOURCE_PASSWORD:studywithme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
