spring:
  application:
    name: studywithme
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/studywithme}
    username: ${SPRING_DATASOURCE_USERNAME:studywithme}
    password: ${SPRING_DATASOURCE_PASSWORD:studywithme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  auth:
    oauth-success:
      frontend-redirect-uri: ${OAUTH_SUCCESS_FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}
    token:
      issuer: ${JWT_ISSUER:studywithme}
      secret: ${JWT_SECRET:studywithme-local-development-secret-key-change-me}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
    refresh-token-cookie:
      name: ${REFRESH_TOKEN_COOKIE_NAME:refreshToken}
      path: ${REFRESH_TOKEN_COOKIE_PATH:/api/v1/auth}
      secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
      same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
  outbox:
    kafka:
      topic: ${OUTBOX_KAFKA_TOPIC:studywithme.outbox.events}
      relay-enabled: ${OUTBOX_KAFKA_RELAY_ENABLED:false}
      poll-interval-ms: ${OUTBOX_KAFKA_POLL_INTERVAL_MS:5000}
      batch-size: ${OUTBOX_KAFKA_BATCH_SIZE:100}
  notification:
    outbox:
      worker-enabled: ${NOTIFICATION_OUTBOX_WORKER_ENABLED:true}
      poll-interval-ms: ${NOTIFICATION_OUTBOX_POLL_INTERVAL_MS:5000}
    kafka:
      consumer-enabled: ${NOTIFICATION_KAFKA_CONSUMER_ENABLED:false}
      group-id: ${NOTIFICATION_KAFKA_GROUP_ID:studywithme-notification}
