spring:
  application:
    name: studywithme
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/studywithme}
    username: ${SPRING_DATASOURCE_USERNAME:studywithme}
    password: ${SPRING_DATASOURCE_PASSWORD:studywithme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    token:
      issuer: ${JWT_ISSUER:studywithme}
      secret: ${JWT_SECRET:studywithme-local-development-secret-key-change-me}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
    refresh-token-cookie:
      name: ${REFRESH_TOKEN_COOKIE_NAME:refreshToken}
      path: ${REFRESH_TOKEN_COOKIE_PATH:/api/v1/auth}
      secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
      same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
