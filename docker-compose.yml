services:
  postgres:
    image: postgres:16-alpine
    container_name: studywithme-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: studywithme
      POSTGRES_USER: studywithme
      POSTGRES_PASSWORD: studywithme
    volumes:
      - studywithme-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studywithme -d studywithme"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.8
    container_name: studywithme-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes:
      - studywithme-kafka-data:/bitnami/kafka

volumes:
  studywithme-postgres-data:
  studywithme-kafka-data:
